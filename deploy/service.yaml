# ============================================================
# NTUST SiPh Lab - Cloud Run 宣告式服務設定（選用）
#
# 用途（SAI §9.4 目錄樹）：
#   把 Cloud Run 的設定納入版本控制，避免「只存在於某人終端機
#   歷史中的 gcloud run deploy 指令」。使用方式：
#
#     gcloud run services replace deploy/service.yaml --region=asia-east1
#
#   deploy/cloudrun.md 的指令式流程與本檔等價；擇一使用即可。
#   本檔的好處是設定漂移可由 git diff 看出來。
#
# 使用前必須替換的預留位置：
#   PROJECT_ID / REGION / DOMAIN / GIT_SHA
#
# 資料庫（2026-08-17 依實際部署更新）：
#   本案使用 Neon 免費方案，不是 Cloud SQL（ADR-013）。因此：
#     - 沒有 run.googleapis.com/cloudsql-instances 註解
#     - DATABASE_URL 是完整連線字串，整條存於 Secret Manager，
#       不再由「unix socket 路徑 + 另一個密碼 secret」組合
#   若日後改回 Cloud SQL，需補回該註解並改寫 DATABASE_URL。
#
# 硬性規定：
#   1. 禁止在本檔填入任何 secret 值。SECRET_KEY、AUDIT_IP_SALT 與
#      DATABASE_URL 一律以 secretKeyRef 引用（SAI §11.2、[S21]）。
#   2. 禁止把 STORAGE_BACKEND 設為 local —— Cloud Run 的
#      container filesystem 不具持久性 [S17]，ProductionConfig
#      會直接拒絕啟動。
#   3. 禁止把 DATABASE_URL 設為 sqlite（ADR-004）。
#   4. 禁止把 minScale 調成 0 以外的值 —— 那會讓月費從 NT$0
#      變成每月數百元（見 deploy/cloudrun.md §11）。
#
# 維護契約：
#   新增環境變數時必須同步更新 .env.example、app/config.py 與
#   docs/cloudrun-deployment.md，否則會出現「本機可跑、
#   Cloud Run 啟動失敗」。
# ============================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ntust-siph-lab
  labels:
    cloud.googleapis.com/location: REGION
  annotations:
    run.googleapis.com/ingress: all

spec:
  template:
    metadata:
      annotations:
        # 無 cloudsql-instances 註解：Neon 走公網 TLS，不需要掛載
        # unix socket（ADR-013）。
        #
        # minScale=0 是零成本的關鍵：沒有流量時不計費。
        # 研究室網站流量低；maxScale 刻意壓低以控制成本。
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/startup-cpu-boost: "true"

    spec:
      serviceAccountName: siph-lab-run@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60

      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/siph-lab/ntust-siph-lab:GIT_SHA
          ports:
            - name: http1
              containerPort: 8000

          resources:
            limits:
              cpu: "1"
              memory: 512Mi

          env:
            - name: APP_ENV
              value: production

            - name: PUBLIC_BASE_URL
              value: https://DOMAIN

            - name: DB_BACKEND
              value: postgresql

            # DATABASE_URL 見下方 secrets 區塊：Neon 的 host/user/password
            # 都在同一條連線字串裡，因此整條存成一個 secret。
            # 注意連線字串必須使用 direct 端點（主機名稱不含 -pooler），
            # 原因見 deploy/cloudrun.md §1.2。

            - name: STORAGE_BACKEND
              value: gcs

            - name: GCS_BUCKET
              value: PROJECT_ID-siph-media

            # bucket 為私有時指向 CDN / Load Balancer；
            # 公開 bucket 可留空（見 app/storage/gcs.py 已知限制 2）。
            - name: GCS_PUBLIC_BASE_URL
              value: ""

            - name: SESSION_COOKIE_SECURE
              value: "true"

            - name: PERMANENT_SESSION_LIFETIME_HOURS
              value: "8"

            - name: LOG_LEVEL
              value: INFO

            - name: ROBOTS_POLICY
              value: public

            - name: ENABLE_LLMS_TXT
              value: "false"

            - name: WEB_CONCURRENCY
              value: "2"

            - name: DB_POOL_SIZE
              value: "5"

            - name: DB_MAX_OVERFLOW
              value: "2"

            # --- Secrets（Secret Manager，[S21]）---
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: siph-secret-key
                  key: latest

            # Neon 的完整連線字串（含 host/user/password）。
            # 取代了 Cloud SQL 版本的 siph-db-password。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: siph-database-url
                  key: latest

            # AuditLog 的 IP 雜湊 salt（SAI §8.8）。
            # 必須由環境提供：使用固定預設值會讓 IPv4 雜湊
            # 可被完整反查（見 app/models/audit_log.py）。
            - name: AUDIT_IP_SALT
              valueFrom:
                secretKeyRef:
                  name: siph-audit-ip-salt
                  key: latest

          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
            timeoutSeconds: 5

  traffic:
    # 部署新 revision 後先不切流量，通過 smoke test 才切（SAI §21.6）。
    - percent: 100
      latestRevision: true
