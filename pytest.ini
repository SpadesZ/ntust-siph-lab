# ============================================================
# NTUST SiPh Lab - Pytest Configuration
#
# 檔案路徑：pytest.ini
# 建立日期：2026-08-14 / 版本：v1.0
#
# 模組定位：
#   統一測試執行設定，讓 CI 與本機行為一致。
#
# 設定說明：
#   testpaths      - 只掃描 tests/，避免誤收 scripts/ 中的檔案
#   python_files   - 測試檔命名規則
#   markers        - 自訂標記；未宣告的 marker 會產生警告
#   filterwarnings - 把非預期的 DeprecationWarning 顯示出來，
#                    以便及早發現套件升級帶來的問題
#
# 標記用途：
#   slow      - 較慢的測試（migration round trip、backup）
#   postgres  - 需要 PostgreSQL 才能執行；無資料庫時自動 skip
#   acceptance- 直接對應 SAI 附錄 A/§20.1 的 AC 條目
#
# 常用指令：
#   pytest                      全部
#   pytest -m acceptance        只跑驗收條目
#   pytest -m "not slow"        跳過慢速測試
#   pytest --cov=app            覆蓋率
#
# 驗證方式：
#   pytest --collect-only
# ============================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    slow: 執行時間較長的測試（migration round trip、備份還原）
    postgres: 需要 PostgreSQL 環境；未設定時自動 skip
    acceptance: 直接對應 SAI 驗收條目（AC-01 ~ AC-26）

filterwarnings =
    ignore::DeprecationWarning:flask_limiter.*
