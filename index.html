<!--
  NTUST SiPh Lab — 單檔互動版（GitHub Pages 用）

  這是 https://github.com/SpadesZ/ntust-siph-lab 的靜態呈現版：
  所有 CSS、JavaScript、資料與圖片都內嵌在這一個檔案裡，不需要伺服器或資料庫。
  內容擷取自公開線上站（2026-10-08），頁面切換使用 URL hash（#/research），
  因此 GitHub Pages 不需要任何 rewrite 規則。
  完整系統（Flask + SQLAlchemy + 後台管理）請見 repo 與 Cloud Run 線上站。
-->
<style>
:root {
  --color-ink: #17212b;
  --color-navy: #10233d;
  --color-photon: #00a6a6;
  --color-photon-bright: #2ed6d6;
  --color-photon-deep: #007070;
  --color-surface: #ffffff;
  --color-surface-muted: #f2f6f8;
  --color-surface-sunken: #e8eef2;
  --color-line: #d6e0e5;
  --color-ink-soft: #45566a;
  --color-ink-faint: #5a6b80;
  --color-navy-soft: #1b3557;
  --color-info: #10527d;
  --color-info-bg: #e8f1f8;

  --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

  --text-xs: 0.8125rem;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-md: 1.1875rem;
  --text-lg: 1.4375rem;
  --text-xl: 1.75rem;
  --text-2xl: 2.25rem;
  --text-3xl: 3rem;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px;

  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 999px;
  --content-max: 1180px;
  --measure-text: 68ch;
  --gutter: 20px;
  --shadow-sm: 0 1px 2px rgba(16, 35, 61, 0.06);
  --shadow-md: 0 4px 16px rgba(16, 35, 61, 0.08);
  --focus-ring: 3px solid var(--color-photon-deep);
  --duration: 160ms;
  --easing: cubic-bezier(0.2, 0, 0.1, 1);
}
@media (min-width: 640px) { :root { --gutter: 32px; } }
@media (prefers-reduced-motion: reduce) { :root { --duration: 0.01ms; } }
@media (prefers-contrast: more) {
  :root { --color-ink-soft: #2b3949; --color-ink-faint: #45566a; --color-line: #9fb2bd; }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-surface);
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
img { max-width: 100%; display: block; }
a { color: var(--color-photon-deep); text-underline-offset: 3px; }
a:hover { color: var(--color-navy); }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
h1:focus { outline: none; }
[hidden] { display: none !important; }

.container { width: 100%; max-width: calc(var(--content-max) + var(--gutter) * 2); margin-inline: auto; padding-inline: var(--gutter); }
.skip-link {
  position: absolute; left: var(--space-4); top: -100px; z-index: 200;
  background: var(--color-surface); color: var(--color-ink); padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
}
.skip-link:focus { top: var(--space-4); }

/* ---------- header ---------- */
.site-header { background: var(--color-navy); color: #fff; position: sticky; top: 0; z-index: 100; }
.site-header__inner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: 64px; }
.brand { display: flex; align-items: center; gap: var(--space-3); color: #fff; text-decoration: none; font-weight: 700; letter-spacing: 0.01em; }
.brand:hover { color: #fff; }
.brand img { width: 36px; height: 36px; border-radius: 50%; background: #fff; }
.nav-toggle {
  background: transparent; color: #fff; border: 1px solid var(--color-navy-soft); border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3); font: inherit; font-size: var(--text-sm); cursor: pointer;
}
.nav-toggle:hover { border-color: var(--color-photon-bright); }
.site-nav { display: none; width: 100%; padding-bottom: var(--space-3); }
.site-nav.is-open { display: block; }
.site-header__inner { flex-wrap: wrap; }
.site-nav ul { display: flex; flex-direction: column; gap: 2px; }
.site-nav a {
  display: block; color: #d7e4ef; text-decoration: none; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm); font-size: var(--text-sm); border-bottom: 2px solid transparent;
}
.site-nav a:hover { color: #fff; background: var(--color-navy-soft); }
.site-nav a[aria-current="page"] { color: #fff; background: var(--color-navy-soft); border-bottom-color: var(--color-photon-bright); }
.site-header :focus-visible { outline-color: var(--color-photon-bright); }
@media (min-width: 900px) {
  .nav-toggle { display: none; }
  .site-nav, .site-nav.is-open { display: block; width: auto; padding-bottom: 0; }
  .site-nav ul { flex-direction: row; gap: var(--space-1); }
  .site-nav a { padding: var(--space-5) var(--space-3) calc(var(--space-5) - 2px); border-radius: 0; background: transparent !important; }
  .site-nav a[aria-current="page"] { border-bottom-color: var(--color-photon-bright); }
  .site-nav a:hover { border-bottom-color: var(--color-photon); }
}

/* ---------- common blocks ---------- */
main { flex: 1; }
.section { padding-block: var(--space-12); }
.section--muted { background: var(--color-surface-muted); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.eyebrow { font-size: var(--text-xs); letter-spacing: 0.06em; color: var(--color-ink-faint); text-transform: uppercase; font-weight: 600; }
h1 { font-size: clamp(1.75rem, 1.2rem + 2.4vw, var(--text-2xl)); line-height: 1.25; letter-spacing: -0.02em; font-weight: 700; }
h2 { font-size: var(--text-xl); line-height: 1.3; letter-spacing: -0.01em; font-weight: 700; }
h3 { font-size: var(--text-md); line-height: 1.4; font-weight: 650; }
.trace { position: relative; padding-bottom: var(--space-4); margin-bottom: var(--space-6); }
.trace::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 72px; height: 3px; background: var(--color-photon);
  border-radius: 2px;
}
.trace::before {
  content: ""; position: absolute; left: 72px; bottom: -3px; width: 9px; height: 9px; background: var(--color-photon);
  border-radius: 50%;
}
.lede { font-size: var(--text-md); color: var(--color-ink-soft); max-width: var(--measure-text); }
.muted { color: var(--color-ink-soft); }
.small { font-size: var(--text-sm); }
.link-arrow { font-size: var(--text-sm); font-weight: 600; text-decoration: none; }
.link-arrow:hover { text-decoration: underline; }

.btn {
  display: inline-flex; align-items: center; gap: var(--space-2); font: inherit; font-weight: 600; font-size: var(--text-sm);
  padding: var(--space-3) var(--space-5); border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer;
  text-decoration: none; transition: background var(--duration) var(--easing), border-color var(--duration) var(--easing);
}
.btn--primary { background: var(--color-photon-deep); color: #fff; }
.btn--primary:hover { background: var(--color-navy); color: #fff; }
.btn--ghost { background: var(--color-surface); color: var(--color-navy); border-color: var(--color-line); }
.btn--ghost:hover { border-color: var(--color-photon-deep); color: var(--color-navy); }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }

/* ---------- hero ---------- */
.hero {
  padding-block: var(--space-16) var(--space-12);
  background-color: var(--color-surface);
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent 119px, rgba(214, 224, 229, 0.7) 119px, rgba(214, 224, 229, 0.7) 120px);
  border-bottom: 1px solid var(--color-line);
}
.hero h1 { font-size: clamp(2rem, 1.2rem + 3.4vw, var(--text-3xl)); }
.hero .eyebrow { margin-bottom: var(--space-4); }
.hero .lede { margin-bottom: var(--space-8); }
.hero-stats { display: flex; flex-wrap: wrap; gap: var(--space-8); margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--color-line); }
.stat dt { font-size: var(--text-xs); color: var(--color-ink-faint); letter-spacing: 0.04em; }
.stat dd { font-size: var(--text-xl); font-weight: 700; color: var(--color-navy); line-height: 1.3; font-variant-numeric: tabular-nums; }

/* ---------- direction list ---------- */
.directions { display: grid; gap: 0; grid-template-columns: 1fr; }
@media (min-width: 640px) { .directions { grid-template-columns: repeat(2, 1fr); column-gap: var(--space-8); } }
@media (min-width: 900px) { .directions { grid-template-columns: repeat(3, 1fr); } }
.directions li { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--color-line); }
.directions li::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--color-photon); transform: translateY(1px); }
.directions .en { display: block; font-size: var(--text-sm); color: var(--color-ink-faint); }

/* ---------- cards ---------- */
.grid { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid--2 { grid-template-columns: repeat(2, 1fr); } .grid--people { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid--3 { grid-template-columns: repeat(3, 1fr); } .grid--people { grid-template-columns: repeat(3, 1fr); } }
.card {
  background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md);
  padding: var(--space-6); transition: border-color var(--duration) var(--easing), box-shadow var(--duration) var(--easing);
}
.card:hover, .card:focus-within { border-color: var(--color-photon); box-shadow: var(--shadow-md); }
.card h3 a { color: var(--color-navy); text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.card h3 a::after { content: ""; position: absolute; inset: 0; }
.card { position: relative; }
.card .tags a, .card .tags button, .card .authors a { position: relative; z-index: 1; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: var(--text-xs); color: var(--color-ink-faint); margin-bottom: var(--space-3); }
.badge { display: inline-block; padding: 1px var(--space-3); border-radius: var(--radius-pill); background: var(--color-info-bg); color: var(--color-info); font-weight: 600; border: 1px solid transparent; }
.badge--conf { background: var(--color-surface-muted); color: var(--color-ink-soft); border-color: var(--color-line); }
.venue { font-style: italic; }
.card .zh { color: var(--color-ink-soft); font-size: var(--text-sm); margin-top: var(--space-1); }
.card .excerpt { font-size: var(--text-sm); color: var(--color-ink); margin-top: var(--space-3); }
.card .authors { font-size: var(--text-sm); margin-top: var(--space-3); color: var(--color-ink-soft); }

.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
.tag {
  font: inherit; font-size: var(--text-xs); padding: 2px var(--space-3); border-radius: var(--radius-pill);
  border: 1px solid var(--color-line); background: var(--color-surface-muted); color: var(--color-ink-soft); cursor: pointer;
}
.tag:hover { border-color: var(--color-photon-deep); color: var(--color-navy); }
.tag[aria-pressed="true"] { background: var(--color-navy); color: #fff; border-color: var(--color-navy); }
span.tag { cursor: default; }
span.tag:hover { border-color: var(--color-line); color: var(--color-ink-soft); }

.person { display: flex; gap: var(--space-4); align-items: center; }
.avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--color-navy); color: #fff;
  display: grid; place-items: center; font-size: var(--text-lg); font-weight: 700; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.person h3 { margin: 0; }
.person .sub { font-size: var(--text-sm); color: var(--color-ink-soft); }
.person--lg .avatar { width: 128px; height: 128px; font-size: var(--text-2xl); }

/* ---------- research filters ---------- */
.filters { background: var(--color-surface-muted); border: 1px solid var(--color-line); border-radius: var(--radius-md); padding: var(--space-5); display: grid; gap: var(--space-5); margin-bottom: var(--space-6); }
.filter-label { display: block; font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--color-ink-faint); margin-bottom: var(--space-2); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  font: inherit; font-size: var(--text-sm); padding: var(--space-2) var(--space-4); border-radius: var(--radius-pill);
  border: 1px solid var(--color-line); background: var(--color-surface); color: var(--color-ink); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--color-photon-deep); }
.chip[aria-pressed="true"] { background: var(--color-navy); color: #fff; border-color: var(--color-navy); }
.chip .n { color: var(--color-ink-faint); margin-left: var(--space-1); font-size: var(--text-xs); }
.chip[aria-pressed="true"] .n { color: #b9d2e6; }
.years { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: stretch; }
.year-btn {
  font: inherit; font-size: var(--text-xs); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 52px;
  padding: var(--space-2) var(--space-2) var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--color-line);
  background: var(--color-surface); color: var(--color-ink); cursor: pointer; font-variant-numeric: tabular-nums;
}
.year-btn:hover { border-color: var(--color-photon-deep); }
.year-btn .bar { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
.year-btn .bar i { display: block; width: 8px; background: var(--color-photon); border-radius: 2px 2px 0 0; }
.year-btn[aria-pressed="true"] { background: var(--color-navy); color: #fff; border-color: var(--color-navy); }
.year-btn[aria-pressed="true"] .bar i { background: var(--color-photon-bright); }
.search-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: end; }
.search-row .field { flex: 1 1 260px; }
.input {
  width: 100%; font: inherit; font-size: var(--text-base); padding: var(--space-3) var(--space-4); border: 1px solid var(--color-ink-faint);
  border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-ink);
}
.result-count { font-size: var(--text-sm); color: var(--color-ink-soft); margin-bottom: var(--space-4); }
.empty { border: 1px dashed var(--color-ink-faint); border-radius: var(--radius-md); padding: var(--space-8); text-align: center; color: var(--color-ink-soft); }
.empty .btn { margin-top: var(--space-4); }

/* ---------- detail ---------- */
.breadcrumb { font-size: var(--text-sm); margin-bottom: var(--space-6); }
.detail { display: grid; gap: var(--space-10); }
@media (min-width: 900px) { .detail { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }
.prose { max-width: var(--measure-text); }
.prose h2 { font-size: var(--text-lg); margin: var(--space-8) 0 var(--space-3); }
.prose h2:first-child { margin-top: 0; }
.prose p + p { margin-top: var(--space-3); }
.title-zh { font-size: var(--text-md); color: var(--color-ink-soft); margin-top: var(--space-2); }
.authors-line { color: var(--color-ink-soft); font-size: var(--text-sm); margin-top: var(--space-3); }
.seg { display: inline-flex; border: 1px solid var(--color-line); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: var(--space-4); }
.seg button { font: inherit; font-size: var(--text-sm); padding: var(--space-2) var(--space-4); border: 0; background: var(--color-surface); color: var(--color-ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--color-line); }
.seg button[aria-pressed="true"] { background: var(--color-navy); color: #fff; }
.aside { display: grid; gap: var(--space-4); }
.aside .card:hover { border-color: var(--color-line); box-shadow: none; }
.aside h2 { font-size: var(--text-sm); letter-spacing: 0.04em; color: var(--color-ink-faint); margin-bottom: var(--space-3); }
.aside dl dt { font-size: var(--text-xs); color: var(--color-ink-faint); }
.aside dl dd { margin-bottom: var(--space-3); word-break: break-word; }
.pager { display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-12); padding-top: var(--space-6); border-top: 1px solid var(--color-line); }
.pager a { max-width: 46%; font-size: var(--text-sm); }
.facts { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 640px) { .facts { grid-template-columns: repeat(2, 1fr); } }
.facts dt { font-size: var(--text-xs); color: var(--color-ink-faint); letter-spacing: 0.04em; }
.facts dd { font-weight: 600; }
.steps { display: grid; gap: var(--space-4); counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 40px 1fr; gap: var(--space-4); }
.steps li::before {
  content: counter(step); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--color-photon); font-weight: 700; color: var(--color-navy);
}
.steps strong { display: block; }

/* ---------- footer ---------- */
.site-footer { background: var(--color-navy); color: #c9d7e4; padding-block: var(--space-10); font-size: var(--text-sm); }
.site-footer a { color: var(--color-photon-bright); }
.site-footer a:hover { color: #fff; }
.site-footer :focus-visible { outline-color: var(--color-photon-bright); }
.footer-grid { display: grid; gap: var(--space-6); }
@media (min-width: 900px) { .footer-grid { grid-template-columns: 1.2fr 1fr 1.4fr; } }
.site-footer strong { color: #fff; display: block; margin-bottom: var(--space-1); }
.site-footer .note { border-top: 1px solid var(--color-navy-soft); margin-top: var(--space-6); padding-top: var(--space-4); color: #9fb3c6; }
</style>
</head>

<script type="application/json" id="papers-data">[{"slug":"real-time-signal-quality-monitoring-ann-fpga","type":"期刊論文","year":2025,"venue":"International Journal of Circuit Theory and Applications","titleEn":"Real-Time Monitoring of High-Speed Signal Quality Using Asynchronous Sampling, Amplitude Sorting, and Artificial Neural Network and Its FPGA Implementation","titleZh":"以非同步取樣、振幅排序與類神經網路即時監視高速訊號品質及其 FPGA 實作","authors":"Jau-Ji Jou, Chun-Liang Yang, Chih-Lung Tseng, Chun-Chen Yao, Jun-Yuan Zheng","abstractZh":"高速資料傳輸中，訊號品質監視是確保系統可靠與穩定的關鍵。本研究直接以非同步方式取樣高速訊號波形，再依振幅排序，並以類神經網路（ANN）從這些取樣資料推估訊號品質參數。以 25-Gb/s NRZ 訊號為例，可同時推估 Q 因子、訊雜比、時間抖動、上升時間與下降時間五項參數，並以 FPGA 完成硬體實作，使該方法可用於傳輸模組與元件的即時品質監視。","abstractEn":"In high-speed data transmission, signal quality monitoring guarantees transmission system reliability and stability. In this study, high-speed signal waveforms were sampled directly and asynchronously, and then the sampled values were sorted by amplitude. Using these sampled data sets, we propose an artificial neural network (ANN) model to estimate signal quality parameters of high-speed signals. The sampled values can clearly show the characteristics of the waveform after amplitude sorting, which will significantly reduce the error of parameter calculation, and a relatively simple ANN model can be used. Using 25-Gb/s non-return-to-zero signals as an example, the ANN inputs 40 signal sampling data through a hidden layer with 7 neurons and can estimate five types of signal quality parameters: Q-factor, signal-to-noise ratio, time jitter, rise time, and fall time. The mean square error of the calculated time jitter was 11.8%, and those of the other parameters were lower than 10%. The simple ANN model will be easier to implement in hardware. A field-programmable gate array was used to implement the ANN hardware for estimating signal quality parameters. The calculated average errors of the five signal quality parameters between software and hardware methods were less than 1%. The implemented hardware estimation of high-speed signal quality parameters could be used for real-time signal quality monitoring in high-speed data transmission modules and devices.","problem":"高速資料傳輸系統的可靠性與穩定性仰賴訊號品質監視，但傳統參數量測不易在傳輸中即時進行。","method":"直接對高速訊號波形進行非同步取樣，再將取樣值依振幅排序；排序後的取樣值能清楚呈現波形特徵，可顯著降低參數計算誤差，因此只需相對簡單的類神經網路模型。以 25-Gb/s NRZ 訊號為例，將 40 筆取樣資料輸入具 7 個神經元隱藏層的 ANN，推估五項訊號品質參數。並以現場可程式閘陣列（FPGA）實作該 ANN 硬體。","result":"可推估 Q 因子、訊雜比、時間抖動、上升時間與下降時間五項參數。時間抖動的均方誤差為 11.8%，其餘參數均低於 10%。軟體與硬體兩種方法之間，五項參數的平均誤差小於 1%。","contribution":"簡化的 ANN 模型較易以硬體實現；所完成的硬體推估可用於高速資料傳輸模組與元件的即時訊號品質監視。","doi":"10.1002/cta.4557","keywords":["光訊號品質監視","非同步取樣","振幅排序","類神經網路","FPGA","NRZ"]},{"slug":"wdm-pon-protection-reconfigurable-optical-amplifiers","type":"期刊論文","year":2022,"venue":"Applied Sciences, 12(1), 365","titleEn":"Protection Scheme for a Wavelength-Division-Multiplexed Passive Optical Network Based on Reconfigurable Optical Amplifiers","titleZh":"以可重構光放大器為基礎的分波多工被動光網路保護機制","authors":"Hong-Sing Lee, Chun-Liang Yang, Chien-Hsiang Chou","abstractZh":"本研究提出以新型可重構光放大器（ROA）為基礎的分波多工被動光網路（WDM-PON）保護機制。ROA 由 2×2 交叉式光開關、自製四埠可逆光循環器與傳統摻鉺光纖放大器構成，其切換特性可滿足多數網路管理與監視需求。研究並提出雙向光放大器保護的最佳化設計，以 40 個上/下行通道的 WDM-PON 模擬驗證可行性，使高容量多波長網路能在實際運作情境下進行智慧型保護切換。","abstractEn":"This paper demonstrates a wavelength-division-multiplexed passive optical network (WDM-PON) scheme based on novel reconfigurable optical amplifiers (ROAs). The measured switching characteristics of the ROA3 constructed with a 2 x 2 crossbar optical switch and a four-port reversible optical circulator (OC) and a conventional EDFA can meet the requirements of most network management and surveillance. The self-made four-port reversible OC's response time is less than 2 ms, and its insertion losses are about 1 dB or less for all the transmission paths and switching states. An optimal design of ROAs is proposed and evaluated for bidirectional optical amplifier protection, in which ROA3 has an EDF length of 7.5 m long with a 1480 nm pump laser and possesses a backward or forward pumping configuration with the corresponding pump power of 200 mW or 50 mW. We verified the scheme's feasibility through a simulation of WDM-PON systems with 40 downstream and upstream channels. This scheme enables the intelligent protection switching in practical operation scenarios for high-capacity multi-wavelength networks.","problem":"高容量多波長網路需要能在實際運作情境下進行智慧型保護切換的機制。","method":"以新型可重構光放大器（ROA）建構 WDM-PON 保護機制。ROA3 由 2×2 交叉式光開關、四埠可逆光循環器與傳統 EDFA 組成；並針對雙向光放大器保護提出最佳化設計 —— ROA3 採用 7.5 公尺摻鉺光纖與 1480 nm 泵浦雷射，可配置為後向或前向泵浦，對應泵浦功率分別為 200 mW 與 50 mW。","result":"自製四埠可逆光循環器的響應時間小於 2 ms，在所有傳輸路徑與切換狀態下的插入損耗約為 1 dB 以下。並以具 40 個下行與上行通道的 WDM-PON 系統模擬驗證機制可行性。","contribution":"該切換特性可滿足多數網路管理與監視需求，使高容量多波長網路能在實際運作情境中實現智慧型保護切換。","doi":"10.3390/app12010365","keywords":["WDM-PON","光網路保護","可重構光放大器","被動光網路"]},{"slug":"performance-monitoring-nrz-machine-learning","type":"會議論文","year":2021,"venue":"2021 International Symposium on Intelligent Signal Processing and Communication Systems (ISPACS)","titleEn":"Performance Monitoring of High-Speed NRZ Signals Using Machine Learning Techniques","titleZh":"以機器學習技術監視高速 NRZ 訊號效能","authors":"Chun-Chen Yao, Jun-Yuan Zheng, Jau-Ji Jou, Chun-Liang Yang","abstractZh":"高速通訊網路技術的發展帶動了對訊號效能監視的需求。本研究提出以類神經網路（ANN）監視 25-Gb/s NRZ 訊號效能的方法，可推估 Q 因子、訊雜比、時間抖動、上升時間與下降時間五項參數。此以機器學習為基礎的參數萃取技術，可應用於高速 NRZ 訊號的光網路即時效能監視。","abstractEn":"Advances in high-speed communication network technologies have spurred interest in signal performance monitoring. This study proposed a 25-Gb/s non-return-to-zero (NRZ) signal performance monitoring method using an artificial neural network (ANN), which can estimate the five parameters of Q factor, signal-to-noise ratio, time jitter, rise time, and fall time. Using 5000 data sets and adopting seven neurons in the hidden layer, the mean relative errors of the five estimated parameters are about 5.76% to 11.74%. This parameter extraction technique based on machine learning can apply to real-time optical network performance monitoring for high-speed NRZ signals.","problem":"高速通訊網路的發展使訊號效能監視成為必要，需要可即時取得的效能參數。","method":"以類神經網路建立 25-Gb/s NRZ 訊號的效能監視方法，使用 5000 組資料集，隱藏層採用 7 個神經元。","result":"可推估 Q 因子、訊雜比、時間抖動、上升時間與下降時間五項參數，五項推估參數的平均相對誤差約為 5.76% 至 11.74%。","contribution":"此以機器學習為基礎的參數萃取技術，可應用於高速 NRZ 訊號的光網路即時效能監視。","doi":"10.1109/ispacs51563.2021.9650979","keywords":["效能監視","機器學習","NRZ","光通訊"]},{"slug":"ream-wdm-pon-remote-amplification-fault-monitoring","type":"期刊論文","year":2012,"venue":"Journal of Optical Communications and Networking, 4(4), 336","titleEn":"Design and Demonstration of REAM-Based WDM-PONs With Remote Amplification and Channel Fault Monitoring","titleZh":"具遠端放大與通道故障監視之 REAM 型 WDM-PON 設計與實證","authors":"Shu-Chuan Lin, San-Liang Lee, Cheng-Kuang Liu, Chun-Liang Yang, Sun-Chien Ko, Ty-Wang Liaw","abstractZh":"以反射式電吸收調變器（REAM）作為無色上行發射器，是分波多工被動光網路提供 10 Gb/s 以上速率的可行方向。本研究探討在光網路單元使用 REAM 時，以遠端泵浦光放大器提升所有上行通道的可行性。該遠端泵浦架構可藉由摻鉺光纖增益與拉曼放大，同時提升上行、下行與監視訊號，並避免使用整合半導體光放大器的 REAM 等較複雜元件。","abstractEn":"The use of reflective electro-absorption modulators (REAMs) as colorless upstream transmitters for wavelength-division-multiplexing passive optical networks is attractive for providing 10 Gb/s and above data rates. We address the feasibility of applying the remotely pumped optical amplifier to boost all upstream channels when REAMs are used at the optical network units. This scheme can avoid the use of more complicated devices, such as integrated REAMs with semiconductor optical amplifiers. The remote pumping scheme can simultaneously boost the upstream and downstream signals as well as the monitoring signals by the gain from the erbium-doped fiber and Raman amplification. The required pump power and the limitation on the seeding power are analyzed in order to optimize the bidirectional transmission performance for different access network spans.","problem":"在光網路單元採用 REAM 時，需要在不引入更複雜元件的前提下提升所有上行通道的功率。","method":"採用遠端泵浦光放大器架構，藉由摻鉺光纖增益與拉曼放大，同時提升上行、下行與監視訊號；並分析所需泵浦功率與種子光功率的限制。","result":"驗證了以遠端泵浦提升全部上行通道的可行性，並針對不同接取網路跨距最佳化雙向傳輸效能。","contribution":"此架構可避免使用整合半導體光放大器的 REAM 等較複雜元件，使 REAM 型 WDM-PON 得以提供 10 Gb/s 以上的資料速率。","doi":"10.1364/jocn.4.000336","keywords":["WDM-PON","REAM","遠端放大","通道故障監視"]},{"slug":"rsoa-wdm-pon-single-fabry-perot-etalon","type":"期刊論文","year":2011,"venue":"Microwave and Optical Technology Letters","titleEn":"Performance Enhancement Scheme for RSOA-Based WDM-PONs by Using a Single Fabry-Perot Etalon","titleZh":"以單一法布里–佩羅標準具提升 RSOA 型 WDM-PON 效能之方法","authors":"Chun-Liang Yang, Ting-Lin Hsieh, Shu-Chuan Lin, Gerd Keiser, San-Liang Lee","abstractZh":"本研究針對以反射式半導體光放大器（RSOA）為基礎的 WDM-PON，提出同時達成消光比提升、光頻率穩定與波長再利用的方法。作法是只在光線路終端設置單一法布里–佩羅標準具，而非在每個光網路單元各配置一個，藉此穩定光通道頻率並改善雙向傳輸效能。","abstractEn":"A scheme for simultaneous extinction ratio enhancement, optical frequency stabilization, and wavelength reuse is proposed for reflective semiconductor optical amplifier-based wavelength-division-multiplexed passive optical networks to stabilize the optical channel frequency and enhance bidirectional transmission. This is achieved by simply employing a single Fabry-Perot etalon at the optical line terminal rather than having one at each optical network unit. Compared with the remodulation scheme that uses a 10-Gb/s optical signal with a 3-dB extinction ratio as a downstream optical signal and a seed light, our scheme shows improvements in power penalties greater than 1.8 dB and 1.4 dB for 10-Gb/s downstream and 1.25-Gb/s upstream signals, respectively, after transmission of 25 km at a bit-error-rate = 10-9. Moreover, a power penalty of only 0.5-dB is observed in comparison to the two 1.25-Gb/s upstream bit-error-rate results based on using a continuous-wave seed light and a data-erased seed light.","problem":"RSOA 型 WDM-PON 需要同時穩定光通道頻率、提升消光比並支援波長再利用，但在每個光網路單元各配置元件會增加成本與複雜度。","method":"僅在光線路終端（OLT）設置單一法布里–佩羅標準具，而非於每個光網路單元（ONU）各設一個。","result":"與使用 3-dB 消光比之 10-Gb/s 下行訊號兼種子光的再調變架構相比，在傳輸 25 公里、位元錯誤率為 10⁻⁹ 的條件下，10-Gb/s 下行與 1.25-Gb/s 上行訊號的功率損失分別改善超過 1.8 dB 與 1.4 dB。此外，相較於使用連續波種子光與資料抹除種子光的兩組 1.25-Gb/s 上行結果，功率損失僅 0.5 dB。","contribution":"以單一元件取代逐一配置，可在降低系統複雜度的前提下穩定光通道頻率並改善雙向傳輸。","doi":"10.1002/mop.26178","keywords":["RSOA","WDM-PON","Fabry-Perot etalon","效能提升"]},{"slug":"spectral-filtering-directly-modulated-channels-fp-etalon","type":"期刊論文","year":2009,"venue":"Journal of Optical Networking, 8(3), 306","titleEn":"Spectral Filtering of Multiple Directly Modulated Channels for WDM Access Networks by Using an FP Etalon","titleZh":"以 FP 標準具對 WDM 接取網路多路直接調變通道進行頻譜濾波","authors":"Shu-Chuan Lin, San-Liang Lee, Chun-Liang Yang","abstractZh":"頻譜與波形整形可延長以直接調變雷射為發射器的光纖鏈路傳輸距離。本研究證實可用結構簡單的法布里–佩羅（FP）標準具作為頻譜整形元件，應用於分波多工（WDM）接取網路，並以時間解析啁啾量測詳細分析直接調變雷射的暫態啁啾與絕熱啁啾，釐清原始消光比與絕熱啁啾對頻譜整形的影響以取得最佳操作條件。","abstractEn":"Spectral and waveform reshaping schemes can enhance the transmission distance of fiber links that use directly modulated lasers as transmitters. We prove the feasibility of using a simple Fabry-Perot (FP) etalon as the spectral reshaper for applications in wavelength division multiplexing (WDM) access networks. The transient chirp and adiabatic chirp of a directly modulated laser are analyzed in detail by using the time-resolved chirp measurement. The effects of the original extinction ratio and the adiabatic chirp on the spectral reshaping are clarified to obtain the optimal operation conditions. It is shown that placing a single-cavity FP etalon filter after multiple 10 Gbits/s directly modulated lasers can extend their transmission distances from <10 to >50 km in the 1.55 um wavelength window. Due to the limited filtering capability of the etalon, the choice of the original extinction ratio and finesse of the etalon is discussed in detail from the experiments and simulation.","problem":"以直接調變雷射作為發射器的光纖鏈路，其傳輸距離受啁啾限制，需要能延長距離且結構簡單的整形方式。","method":"以單腔式 FP 標準具作為頻譜整形元件，置於多台直接調變雷射之後；並以時間解析啁啾量測分析暫態啁啾與絕熱啁啾，釐清原始消光比與絕熱啁啾對整形效果的影響。","result":"在 1.55 μm 波段，將單腔式 FP 標準具置於多台 10 Gbit/s 直接調變雷射之後，可將傳輸距離由小於 10 公里延長至大於 50 公里。","contribution":"受限於標準具的濾波能力，原始消光比與標準具細緻度的選擇需依實驗與模擬結果權衡；該方法為 WDM 接取網路提供了結構簡單的距離延伸途徑。","doi":"10.1364/jon.8.000306","keywords":["頻譜濾波","直接調變","WDM 接取網路","FP etalon"]},{"slug":"optical-isolator-modules-monitoring-dwdm-tunable-lasers","type":"期刊論文","year":2004,"venue":"Journal of Optical Networking, 3(6), 452","titleEn":"Optical-Isolator-Based Modules for Monitoring DWDM Tunable Lasers","titleZh":"以光隔離器為基礎之 DWDM 可調雷射監視模組","authors":"Chun-Liang Yang, San-Liang Lee, Jingshown Wu","abstractZh":"本研究以光隔離器、標準具、偏振器與光二極體的組合，同時監視可調雷射的功率、波長與通道編號，並可偵測雷射調諧過程中可能發生的模態跳躍與調諧不完全問題。監視模組的頻譜響應可調整以匹配波長調諧範圍，並以分立光纖尾纖元件實驗驗證此方法的可行性。","abstractEn":"Simultaneous monitoring of power, wavelength, and channel number for a tunable laser is demonstrated by use of a combination of an optical isolator, an etalon, a polarizer, and photodiodes. The mode hopping and incomplete-tuning problems that might arise in tuning the laser can be detected with the proposed approach. The spectral response of the monitoring module can be adjusted to match the wavelength-tuning range. The spectral adjustment can be performed by rotating the input polarization or the output polarizer. It can also be tuned by rotating the second stage if a two-stage isolator is used. We demonstrate experimentally the feasibility of this approach by use of discrete fiber-pigtailed components.","problem":"可調雷射在調諧過程可能發生模態跳躍與調諧不完全，需要能同時監視功率、波長與通道編號的方式。","method":"結合光隔離器、標準具、偏振器與光二極體構成監視模組。頻譜響應可藉由旋轉輸入偏振或輸出偏振器調整；若採用雙級隔離器，亦可藉由旋轉第二級調整。","result":"可同時監視功率、波長與通道編號，並偵測調諧時的模態跳躍與調諧不完全問題；已以分立光纖尾纖元件實驗驗證可行性。","contribution":"監視模組的頻譜響應可調整以匹配不同的波長調諧範圍，適用於 DWDM 可調光源的效能監視。","doi":"10.1364/jon.3.000452","keywords":["DWDM","可調雷射","波長監視","光隔離器"]},{"slug":"simultaneous-channel-osnr-monitoring-polarization-selective-modulator","type":"期刊論文","year":2004,"venue":"IEEE Photonics Technology Letters","titleEn":"Simultaneous Channel and OSNR Monitoring Using a Polarization-Selective Modulator and an LED","titleZh":"以偏振選擇性調變器與 LED 同時監視通道與光訊雜比","authors":"Chun-Liang Yang, San-Liang Lee, Hen-Wai Tsao, Jingshown Wu","abstractZh":"本研究以一個包含偏振選擇性電光調變器與發光二極體（LED）感測器的小型模組，同時進行光訊雜比（OSNR）監視與通道辨識。調變器兼作偏振器並提供訊號抖動以提升偵測靈敏度，LED 則作為通道感測器，可監視可快速調整的寬廣波長範圍，且對溫度控制的容許度大幅放寬。","abstractEn":"A compact module including a polarization-selective electrooptic modulator and a light-emitting diode (LED) sensor is utilized for optical signal-to-noise-ratio (OSNR) monitoring and channel recognition. The modulator acts as a polarizer and provides signal dithering to improve the detection sensitivity, while the LED is used as a channel sensor. The channel sensor can monitor a wide wavelength range that is rapidly adjustable and can have much relaxed tolerance on temperature control. The combination of a polarization controller/rotator and the polarized modulator can accurately measure the OSNR between 5 and 35 dB with an error less than 0.5 dB.","problem":"光網路需要能同時辨識通道並量測光訊雜比、且對溫度控制要求不高的小型化監視模組。","method":"以偏振選擇性電光調變器搭配 LED 感測器構成小型模組：調變器兼作偏振器並提供訊號抖動以提升偵測靈敏度，LED 作為通道感測器；再與偏振控制器／旋轉器組合使用。","result":"偏振控制器／旋轉器與偏振調變器的組合，可在 5 至 35 dB 範圍內準確量測 OSNR，誤差小於 0.5 dB。","contribution":"通道感測器可監視可快速調整的寬廣波長範圍，且對溫度控制的容許度大幅放寬，有利於實際佈署。","doi":"10.1109/lpt.2004.823756","keywords":["OSNR 監視","通道監視","偏振選擇性調變器","光效能監視"]},{"slug":"wavelength-control-dwdm-fabry-perot-etalon-optoelectronic-diode","type":"期刊論文","year":2004,"venue":"Applied Optics, 43(9), 1914","titleEn":"Wavelength Control of Tunable Dense Wavelength-Division Multiplexing Sources by Use of a Fabry-Perot Etalon and a Semiconductor Optoelectronic Diode","titleZh":"以法布里–佩羅標準具與半導體光電二極體控制可調 DWDM 光源波長","authors":"Chun-Liang Yang, San-Liang Lee, Jingshown Wu","abstractZh":"本研究以標準具控制波長漂移、以半導體光電二極體（SOD）辨識通道，構成高解析度的可調波長控制器。標準具提供穩定的波長參考，SOD 則可偵測雷射調諧時的模態跳躍與調諧不完全問題。並以法布里–佩羅雷射二極體或半導體光放大器驗證監視可調雷射的可行性。","abstractEn":"A high-resolution tunable-wavelength controller is achieved by use of an etalon for control of wavelength drift and a semiconductor optical diode (SOD) for channel recognition. The etalon provides a stable wavelength reference, and the SOD can detect mode-hopping and incomplete-tuning problems in tuning a laser. With the help of a Fabry-Perot etalon as a precise wavelength reference, the usual concern with the temperature stability of a SOD can be relaxed at least tenfold compared with wavelength control with a single SOD. We demonstrate the feasibility of monitoring tunable lasers by using a Fabry-Perot laser diode (FPLD) or a semiconductor optical amplifier (SOA). The induced voltage of the FPLD and that of the SOA are modeled with analytic expressions that can help to optimize the operation of a SOD sensor.","problem":"可調 DWDM 光源需要高解析度的波長控制，而單獨使用半導體光電二極體時，溫度穩定度是主要顧慮。","method":"以標準具控制波長漂移並提供穩定波長參考，以半導體光電二極體（SOD）進行通道辨識；並分別以法布里–佩羅雷射二極體（FPLD）與半導體光放大器（SOA）實作驗證。","result":"以法布里–佩羅標準具作為精確波長參考後，相較於僅使用單一 SOD 的波長控制，對 SOD 溫度穩定度的顧慮可放寬至少十倍。","contribution":"FPLD 與 SOA 的感應電壓可用解析式建模，有助於最佳化 SOD 感測器的操作條件。","doi":"10.1364/ao.43.001914","keywords":["DWDM","波長控制","Fabry-Perot etalon","半導體光電二極體"]}]</script>

/* ================= DOM 小工具（一律走 textContent，不拼 HTML 字串）================= */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
const link = (href, text, cls, extra) => h('a', { href, class: cls, ...extra }, text);
const ext = (href, text, cls) => link(href, text, cls, { rel: 'noopener' });
const paperHref = p => '#/research/' + p.slug;
const personHref = s => '#/people/' + s;
const clip = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);
const badge = p => h('span', { class: 'badge' + (p.type === '會議論文' ? ' badge--conf' : '') }, p.type);

/* ================= 共用片段 ================= */
function avatar(person) {
  const a = h('span', { class: 'avatar', 'aria-hidden': 'true' });
  if (person.advisor) a.append(h('img', { src: PHOTO, alt: '', width: 128, height: 150 }));
  else a.append(person.zh.slice(0, 1));
  return a;
}
function personCard(person) {
  const sub = person.advisor ? `${person.en} · ${person.role}` : person.role;
  return h('li', { class: 'card' },
    h('div', { class: 'person' }, avatar(person),
      h('div', null,
        h('h3', null, link(personHref(person.slug), person.zh)),
        h('p', { class: 'sub' }, sub),
        person.advisor && h('p', { class: 'sub' }, `${DIRECTIONS[0][0]}、${DIRECTIONS[1][0]}等 ${DIRECTIONS.length} 項研究方向`))));
}
function paperCard(p, opts = {}) {
  return h('li', null, h('article', { class: 'card' },
    h('div', { class: 'meta' }, badge(p), h('span', null, String(p.year)), h('span', { class: 'venue' }, p.venue)),
    h('h3', null, link(paperHref(p), p.titleEn)),
    h('p', { class: 'zh' }, p.titleZh),
    !opts.compact && h('p', { class: 'excerpt' }, clip(p.abstractZh, 118)),
    opts.tags && h('ul', { class: 'tags', 'aria-label': '關鍵字' }, p.keywords.map(k =>
      h('li', null, h('button', { type: 'button', class: 'tag', 'data-kw': k, 'aria-label': `以「${k}」篩選` }, k))))));
}
function pageHead(eyebrow, title, lede) {
  return [
    h('p', { class: 'eyebrow' }, eyebrow),
    h('h1', { class: 'trace', tabindex: '-1' }, title),
    lede && h('p', { class: 'lede' }, lede)
  ];
}
function emptyPage(eyebrow, title, message) {
  return {
    title,
    node: h('div', { class: 'container section' }, pageHead(eyebrow, title),
      h('div', { class: 'empty' }, h('p', null, message),
        link('#/research', '先看看已發布的研究成果', 'btn btn--primary')))
  };
}

  return {
    title: '研究成員',
    node: h('div', { class: 'container section' },
      pageHead('Team', '研究成員', `${LAB.zh} 目前的研究團隊。`),
      h('h2', { style: 'margin-bottom:16px' }, '指導教授'),
      h('ul', { class: 'grid grid--people' }, personCard(ADVISOR)),
      h('h2', { style: 'margin:40px 0 4px' }, '在學研究生'),
      h('p', { class: 'muted small', style: 'margin-bottom:16px' }, `（${STUDENTS.length} 位）`),
      h('ul', { class: 'grid grid--people' }, STUDENTS.map(personCard)))
  };
}

function person([slug]) {
  const p = PEOPLE.find(x => x.slug === slug);
  if (!p) return null;
  const related = p.advisor ? PAPERS : [];
  const head = h('div', { class: 'person person--lg' }, avatar(p),
    h('div', null,
      h('h1', { tabindex: '-1' }, p.zh),
      p.en && h('p', { class: 'muted' }, p.en),
      h('p', { class: 'muted' }, p.role)));
  const body = [];
  if (p.advisor) {
    body.push(
      h('p', { style: 'margin-top:24px' }, DIRECTIONS.map(d => d[0]).join('、')),
      h('p', { style: 'margin-top:12px' }, link('mailto:' + LAB.email, LAB.email), '　', ext(LAB.official, 'NTUST Website')),
      h('h2', { style: 'font-size:1.25rem;margin:32px 0 8px' }, '學歷'),
      h('p', null, p.education));
  }
  body.push(
    h('h2', { style: 'margin:40px 0 16px' }, '相關研究成果'),
    related.length
      ? h('ul', { class: 'grid grid--2' }, related.map(x => paperCard(x, { compact: true })))
      : h('div', { class: 'empty' }, h('p', null, '尚未有已發布的研究成果')));
  return {
    title: p.zh,
    node: h('div', { class: 'container section' },
      h('p', { class: 'breadcrumb' }, link('#/members', '← 返回研究成員')), head, body)
  };
}

function research(_, query) {
  const state = {
    type: TYPES.includes(query.get('type')) ? query.get('type') : '',
    year: YEARS.includes(Number(query.get('year'))) ? String(Number(query.get('year'))) : '',
    q: (query.get('q') || '').slice(0, 80)
  };
  const countBy = f => PAPERS.filter(f).length;

  const typeBtns = [['', '全部類型', PAPERS.length], ...TYPES.map(t => [t, t, countBy(p => p.type === t)])].map(([val, label, n]) =>
    h('button', { type: 'button', class: 'chip', 'data-type': val, onclick: () => { state.type = val; update(); } },
      label, h('span', { class: 'n' }, String(n))));
  const yearBtns = [['', '全部年份', PAPERS.length], ...YEARS.map(y => [String(y), String(y), countBy(p => p.year === y)])].map(([val, label, n]) =>
    h('button', { type: 'button', class: 'year-btn', 'data-year': val, 'aria-label': `${label}，${n} 筆`, onclick: () => { state.year = val; update(); } },
      h('span', { class: 'bar', 'aria-hidden': 'true' }, val ? h('i', { style: `height:${n * 9}px` }) : null),
      h('span', null, label), val ? h('span', { 'aria-hidden': 'true' }, `×${n}`) : null));
  const input = h('input', { class: 'input', id: 'kw', type: 'search', placeholder: '標題、摘要、關鍵字、作者…', autocomplete: 'off',
    value: state.q, oninput: e => { state.q = e.target.value; update(); } });
  const reset = h('button', { type: 'button', class: 'btn btn--ghost', onclick: () => { state.type = state.year = state.q = ''; input.value = ''; update(); } }, '清除篩選');
  const count = h('p', { class: 'result-count', 'aria-live': 'polite', role: 'status' });
  const list = h('ul', { class: 'grid grid--2' });

  const match = p => {
    if (state.type && p.type !== state.type) return false;
    if (state.year && String(p.year) !== state.year) return false;
    const q = state.q.trim().toLowerCase();
    if (!q) return true;
    return [p.titleEn, p.titleZh, p.abstractZh, p.abstractEn, p.venue, p.authors, p.keywords.join(' ')].join(' ').toLowerCase().includes(q);
  };
  function update() {
    const rows = PAPERS.filter(match);
    list.replaceChildren(...(rows.length
      ? rows.map(p => paperCard(p, { tags: true }))
      : [h('li', { style: 'grid-column:1/-1' },
          h('div', { class: 'empty' }, h('p', null, '沒有符合條件的研究成果。'),
            h('button', { type: 'button', class: 'btn btn--primary', onclick: () => reset.click() }, '清除篩選')))]));
    const active = state.type || state.year || state.q.trim();
    count.textContent = active ? `符合條件 ${rows.length} 筆，共 ${PAPERS.length} 筆成果` : `共 ${PAPERS.length} 筆成果`;
    reset.hidden = !active;
    typeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === state.type)));
    yearBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.year === state.year)));
    list.querySelectorAll('.tag').forEach(b => b.setAttribute('aria-pressed', String(!!state.q && b.dataset.kw.toLowerCase() === state.q.trim().toLowerCase())));
    const qs = new URLSearchParams();
    if (state.type) qs.set('type', state.type);
    if (state.year) qs.set('year', state.year);
    if (state.q.trim()) qs.set('q', state.q.trim());
    history.replaceState(null, '', '#/research' + (qs.toString() ? '?' + qs : ''));
  }
  list.addEventListener('click', e => {
    const t = e.target.closest('.tag');
    if (!t) return;
    state.q = state.q.trim().toLowerCase() === t.dataset.kw.toLowerCase() ? '' : t.dataset.kw;
    input.value = state.q;
    update();
  });

  const node = h('div', { class: 'container section' },
    pageHead('Research', '研究成果', `${LAB.zh} 的期刊論文與會議論文，依年份排列，可依類型、年份或關鍵字篩選。`),
    h('form', { class: 'filters', onsubmit: e => e.preventDefault(), role: 'search', 'aria-label': '篩選研究成果' },
      h('div', null, h('span', { class: 'filter-label', id: 'lbl-type' }, '成果類型'), h('div', { class: 'chips', role: 'group', 'aria-labelledby': 'lbl-type' }, typeBtns)),
      h('div', null, h('span', { class: 'filter-label', id: 'lbl-year' }, '發表年份（數字為該年篇數）'), h('div', { class: 'years', role: 'group', 'aria-labelledby': 'lbl-year' }, yearBtns)),
      h('div', { class: 'search-row' },
        h('div', { class: 'field' }, h('label', { class: 'filter-label', for: 'kw' }, '關鍵字'), input), reset)),
    count, list);
  update();
  return { title: '研究成果', node };
}

function paper([slug]) {
  const i = PAPERS.findIndex(p => p.slug === slug);
  if (i < 0) return null;
  const p = PAPERS[i];
  const abs = h('p', { id: 'abstract-text', lang: 'zh-Hant-TW' }, p.abstractZh);
  const btnZh = h('button', { type: 'button', 'aria-pressed': 'true' }, '中文');
  const btnEn = h('button', { type: 'button', 'aria-pressed': 'false' }, 'English');
  const setLang = en => {
    abs.textContent = en ? p.abstractEn : p.abstractZh;
    abs.lang = en ? 'en' : 'zh-Hant-TW';
    btnZh.setAttribute('aria-pressed', String(!en));
    btnEn.setAttribute('aria-pressed', String(en));
  };
  btnZh.addEventListener('click', () => setLang(false));
  btnEn.addEventListener('click', () => setLang(true));
  const section = (title, text) => text ? [h('h2', null, title), h('p', null, text)] : [];
  const prev = PAPERS[i - 1], next = PAPERS[i + 1];
  return {
    title: p.titleEn,
    node: h('div', { class: 'container section' },
      h('p', { class: 'breadcrumb' }, link('#/research', '← 返回研究成果')),
      h('div', { class: 'meta' }, badge(p), h('span', null, String(p.year)), h('span', { class: 'venue' }, p.venue)),
      h('h1', { tabindex: '-1', style: 'max-width:30em' }, p.titleEn),
      h('p', { class: 'title-zh' }, p.titleZh),
      h('p', { class: 'authors-line' }, p.authors),
      h('div', { class: 'detail', style: 'margin-top:32px' },
        h('div', { class: 'prose' },
          h('h2', null, '摘要'),
          h('div', { class: 'seg', role: 'group', 'aria-label': '摘要語言' }, btnZh, btnEn),
          abs,
          section('研究問題', p.problem), section('研究方法', p.method),
          section('主要結果', p.result), section('貢獻與限制', p.contribution)),
        h('aside', { class: 'aside', 'aria-label': '成果資訊' },
          h('div', { class: 'card' }, h('h2', null, '研究室參與成員'),
            h('p', null, link(personHref(ADVISOR.slug), ADVISOR.zh))),
          h('div', { class: 'card' }, h('h2', null, '成果資訊'),
            h('dl', null,
              h('dt', null, '類型 / 年份'), h('dd', null, `${p.type} · ${p.year}`),
              h('dt', null, '發表處'), h('dd', null, p.venue),
              p.doi && [h('dt', null, 'DOI'), h('dd', null, ext('https://doi.org/' + p.doi, p.doi))])),
          h('div', { class: 'card' }, h('h2', null, '關鍵字'),
            h('ul', { class: 'tags', style: 'margin-top:0' }, p.keywords.map(k =>
              h('li', null, link('#/research?q=' + encodeURIComponent(k), k, 'tag', { style: 'text-decoration:none' }))))))),
      h('nav', { class: 'pager', 'aria-label': '上下篇' },
        prev ? link(paperHref(prev), '← ' + clip(prev.titleEn, 60)) : h('span'),
        next ? link(paperHref(next), clip(next.titleEn, 60) + ' →') : h('span')))
  };
}

const equipment = () => emptyPage('Facilities', '研究設備與可用設施', '設備資訊整理中，尚未公開。');
const alumni = () => emptyPage('Alumni', '畢業生', '畢業生資料尚未建立。此頁將於研究室提供歷屆畢業生名單與論文題目後更新。');

function join() {
  const step = (t, d, a) => h('li', null, h('div', null, h('strong', null, t), h('span', { class: 'muted' }, d, ' '), a));
  return {
    title: '加入我們',
    node: h('div', { class: 'container section' },
      pageHead('Join us', '加入我們', '目前沒有公開的招募說明。對本研究室的研究方向有興趣的同學，歡迎直接來信詢問，信中請簡述您的背景與想投入的主題。'),
      h('h2', { style: 'margin-bottom:16px' }, '申請前建議先了解'),
      h('ol', { class: 'steps' },
        step('確認研究方向是否相符', '讀過研究方向，確認與自己的興趣一致。', link('#/about', '關於研究室 →')),
        step('閱讀已發表的研究成果', '歷年期刊與會議論文都列在這裡，可從題目與發表處了解研究室的主題範圍。', link('#/research', '研究成果 →')),
        step('看看目前的團隊組成', '列出指導教授與目前的在學成員。', link('#/members', '研究成員 →')),
        step('來信聯絡', '請於信中說明研究興趣、相關背景與希望投入的方向，寄至：', link('mailto:' + LAB.email, LAB.email))),
      h('div', { class: 'card', style: 'margin-top:40px;max-width:520px' },
        h('h3', null, '聯絡方式'),
        h('dl', { class: 'facts', style: 'margin-top:12px' },
          h('div', null, h('dt', null, '指導教授'), h('dd', null, link(personHref(ADVISOR.slug), ADVISOR.zh), ` ${ADVISOR.role}`)),
          h('div', null, h('dt', null, '單位'), h('dd', null, '國立臺灣科技大學 產學創新學院')))))
  };
}

function notFound() {
  return {
    title: '找不到頁面',
    node: h('div', { class: 'container section' }, pageHead('Error 404', '找不到這個頁面', '您造訪的網址不存在。'),
      h('div', { class: 'actions' }, link('#/', '回到首頁', 'btn btn--primary'), link('#/research', '研究成果', 'btn btn--ghost')))
  };
}

/* ================= 路由 ================= */
const ROUTES = [
  [/^\/$/, home], [/^\/about$/, about], [/^\/members$/, members], [/^\/people\/([\w-]+)$/, person],
  [/^\/research$/, research], [/^\/research\/([\w-]+)$/, paper],
  [/^\/equipment$/, equipment], [/^\/alumni$/, alumni], [/^\/join$/, join]
];
const app = document.getElementById('app');
const navList = document.getElementById('navList');
const navToggle = document.getElementById('navToggle');
const siteNav = document.getElementById('siteNav');
NAV.forEach(([path, label]) => navList.append(h('li', null, link('#' + path, label, null, { 'data-path': path }))));
navToggle.addEventListener('click', () => {
  const open = siteNav.classList.toggle('is-open');
  navToggle.setAttribute('aria-expanded', String(open));
});

let first = true;
function render() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const query = new URLSearchParams(qs || '');
  let view = null;
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) { view = fn(m.slice(1), query); break; }
  }
  view = view || notFound();
  app.replaceChildren(view.node);
  document.title = view.title ? `${view.title}｜${LAB.zh}` : `${LAB.zh} Graduate Institute of Advanced Semiconductor Technology｜NTUST SiPh Lab`;
  const section = '/' + (path.split('/')[1] || '');
  navList.querySelectorAll('a').forEach(a => {
    const on = a.dataset.path === section || (section === '/people' && a.dataset.path === '/members');
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  siteNav.classList.remove('is-open');
  navToggle.setAttribute('aria-expanded', 'false');
  if (!first) {
    window.scrollTo(0, 0);
    const heading = app.querySelector('h1');
    if (heading) heading.focus({ preventScroll: true });
  }
  first = false;
}
window.addEventListener('hashchange', render);
render();
})();
